[project]
name = "screen-whiteboard"
version = "2.0.1"
description = "开源屏幕白板工具：Qt 原生 HiDPI、流畅手写、全屏标注与截图保存"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "张庆科", email = "tsingke@hotmail.com" }]
keywords = ["whiteboard", "annotation", "screen", "handwriting", "qt", "hidpi", "windows", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = ["PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["Pillow>=9.0", "PyInstaller>=6.0", "ruff>=0.6"]

[project.scripts]
screen-whiteboard = "screen_whiteboard.app:main"

[project.urls]
Homepage = "https://github.com/tsingke/screen-whiteboard"
Issues = "https://github.com/tsingke/screen-whiteboard/issues"

[tool.setuptools]
packages = ["screen_whiteboard"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

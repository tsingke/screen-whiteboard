[project]
name = "screen-whiteboard"
version = "1.0.0"
description = "开源屏幕白板教学工具：悬浮按钮、全屏标注、截图保存（Windows/macOS/Linux）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "tsingke", email = "tsingke@hotmail.com" }]
keywords = ["whiteboard", "annotation", "screen", "classroom", "tkinter", "windows", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = ["Pillow>=9.0"]

[project.scripts]
screen-whiteboard = "screen_whiteboard.app:main"

[project.urls]
Homepage = "https://github.com/tsingke/screen-whiteboard"
Issues = "https://github.com/tsingke/screen-whiteboard/issues"

[tool.setuptools]
packages = ["screen_whiteboard"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

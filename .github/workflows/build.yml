name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt zstandard
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows:
    name: Windows
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --workpath build/pyinstaller --distpath dist
          --name ScreenWhiteboard --icon assets/screen-whiteboard.ico
          main.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/ScreenWhiteboard.exe

  macos:
    name: macOS
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed
          --workpath build/pyinstaller --distpath dist
          --name ScreenWhiteboard
          --osx-bundle-identifier io.github.tsingke.screenwhiteboard
          --icon assets/screen-whiteboard.icns
          main.py
      - name: Set bundle metadata
        run: |
          VERSION=$(python -c "import screen_whiteboard; print(screen_whiteboard.__version__)")
          PLIST=dist/ScreenWhiteboard.app/Contents/Info.plist
          for key in CFBundleShortVersionString CFBundleVersion; do
            /usr/libexec/PlistBuddy -c "Set :${key} ${VERSION}" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :${key} string ${VERSION}" "$PLIST"
          done
          /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string Copyright (c) 2026 tsingke <tsingke@hotmail.com>" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - dist/ScreenWhiteboard.app
          codesign --verify --deep --strict --verbose=2 dist/ScreenWhiteboard.app
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/ScreenWhiteboard.app ScreenWhiteboard-macOS.zip
      - name: Create DMG
        run: |
          hdiutil create -volname "ScreenWhiteboard" \
            -srcfolder dist/ScreenWhiteboard.app \
            -ov -format UDZO ScreenWhiteboard-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            ScreenWhiteboard-macOS.zip
            ScreenWhiteboard-macOS.dmg

  bundle:
    name: Bundle
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ windows, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/macos
      - name: Assemble Windows + macOS bundle
        run: |
          set -e
          mkdir -p "pkg/Windows版" "pkg/macOS版"
          cp artifacts/windows/ScreenWhiteboard.exe "pkg/Windows版/"
          cp packaging/使用说明.txt "pkg/Windows版/使用说明.txt"
          cp LICENSE "pkg/Windows版/LICENSE.txt"
          cp artifacts/macos/ScreenWhiteboard-macOS.dmg "pkg/macOS版/"
          cp artifacts/macos/ScreenWhiteboard-macOS.zip "pkg/macOS版/"
          cp packaging/使用说明.txt "pkg/macOS版/使用说明.txt"
          cp LICENSE "pkg/macOS版/LICENSE.txt"
          ( cd pkg && zip -r "../ScreenWhiteboard-${GITHUB_REF_NAME}-Windows-macOS.zip" . )
          ls -lh *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: all-platforms
          path: ScreenWhiteboard-*-Windows-macOS.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ bundle ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare assets
        run: |
          cp artifacts/windows-binary/ScreenWhiteboard.exe ScreenWhiteboard-Windows.exe
          cp artifacts/macos-app/ScreenWhiteboard-macOS.zip ScreenWhiteboard-macOS.zip
          cp artifacts/macos-app/ScreenWhiteboard-macOS.dmg ScreenWhiteboard-macOS.dmg
          cp artifacts/all-platforms/ScreenWhiteboard-*-Windows-macOS.zip .
          sha256sum ScreenWhiteboard-Windows.exe ScreenWhiteboard-macOS.zip ScreenWhiteboard-macOS.dmg ScreenWhiteboard-*-Windows-macOS.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ScreenWhiteboard-Windows.exe
            ScreenWhiteboard-macOS.zip
            ScreenWhiteboard-macOS.dmg
            ScreenWhiteboard-*-Windows-macOS.zip
            SHA256SUMS.txt
          generate_release_notes: true

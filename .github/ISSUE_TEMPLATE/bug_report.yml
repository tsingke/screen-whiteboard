name: Bug report
description: 报告一个问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请尽量附上系统版本、Python 版本与复现步骤。
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 23H2 / macOS 15.2 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 与 PySide6 版本
      placeholder: Python 3.12.4, PySide6 6.10
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行 python main.py
        2. 点击开始手写
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 报错信息或截图
      render: text
